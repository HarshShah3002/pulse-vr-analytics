# View: every physical headset ever shipped.
schema: marts
table_name: dim_headsets
label: Headsets
dimensions:
  headset_id: { sql: '"headset_id"', primary_key: true }
  model: { sql: '"model"' }
  firmware_version: { sql: '"firmware_version"', all_values: [4.1.3, 4.2.0, 4.3.1], synonyms: [firmware] }
  manufacture_batch: { sql: '"manufacture_batch"', synonyms: [batch] }
  first_ship_date: { sql: '"first_ship_date"', timeframes: [date, month] }
measures:
  headsets: { aggregate_type: count_distinct, sql: '${headset_id}' }
