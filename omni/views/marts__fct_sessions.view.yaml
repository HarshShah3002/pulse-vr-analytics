# View: one row per real VR session (accidental launches under 60 seconds removed).
schema: marts
table_name: fct_sessions
label: VR Sessions

dimensions:
  session_id: { sql: '"session_id"', primary_key: true, hidden: true }
  member_id: { sql: '"member_id"', hidden: true }
  headset_id: { sql: '"headset_id"', hidden: true }
  module:
    sql: '"module"'
    all_values: [Pain Education, Diaphragmatic Breathing, Mindfulness, Relaxation Escapes, Biofeedback,
                 Anxiety and Stress CBT, Sleep Wind-Down, Gentle Movement]
    synonyms: [program module, content type, therapy module]
  session_name: { sql: '"session_name"', synonyms: [experience, environment, lesson] }
  session_start_ts:
    sql: '"session_start_ts"'
    label: Session Start
    timeframes: [date, week, month, quarter, hour_of_day, day_of_week_name]
    ai_context: This is the real time on the headset. Use it for usage trends, not synced_at_ts.
  synced_at_ts:
    sql: '"synced_at_ts"'
    label: Synced to CRM At
    timeframes: [date, week, month]
  sync_lag_hours: { sql: '"sync_lag_hours"', description: Hours between doing the session and the CRM receiving it. }
  duration_minutes: { sql: '"duration_minutes"', synonyms: [session length, time in headset] }
  completed_flag:
    sql: '"completed_flag"'
    label: Session Completed
    description: Member finished the full experience rather than exiting early.
  day_in_program: { sql: '"day_in_program"', description: Days since the member's first session (0 = first day). }
  program_week: { sql: '"program_week"', description: Week since the member's first session (0 = first week). }
  time_of_day: { sql: '"time_of_day"', all_values: [Morning, Afternoon, Evening] }
  pre_pain_score: { sql: '"pre_pain_score"', description: Self-reported pain before the session (0 to 10). }
  post_pain_score: { sql: '"post_pain_score"', description: Self-reported pain after the session (0 to 10). }
  in_session_pain_relief: { sql: '"in_session_pain_relief"', description: Pre minus post pain score. }

measures:
  sessions:
    aggregate_type: count_distinct
    sql: ${session_id}
    synonyms: [session count, number of sessions, usage]
  members_with_sessions:
    aggregate_type: count_distinct
    sql: ${member_id}
    synonyms: [active users, users]
  sessions_per_member:
    sql: ${sessions} / NULLIF(${members_with_sessions}, 0)
    description: Average sessions per member who did at least one session in the period.
  avg_session_minutes:
    aggregate_type: average
    sql: ${duration_minutes}
    synonyms: [average session duration, avg session length]
  median_session_minutes:
    aggregate_type: median
    sql: ${duration_minutes}
  total_minutes: { aggregate_type: sum, sql: '${duration_minutes}' }
  session_completion_rate:
    sql: COUNT(DISTINCT CASE WHEN ${completed_flag} THEN ${session_id} END) / NULLIF(${sessions}, 0)
    format: percent_1
    description: Share of sessions finished rather than exited early.
  avg_in_session_pain_relief:
    aggregate_type: average
    sql: ${in_session_pain_relief}
    description: Average immediate pain drop during a session (0 to 10 scale).
  median_sync_lag_hours:
    aggregate_type: median
    sql: ${sync_lag_hours}
