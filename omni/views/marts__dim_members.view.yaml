# View: one row per member, with their whole journey (referral to return).
schema: marts
table_name: dim_members
label: Members

dimensions:
  member_id:
    sql: '"member_id"'
    primary_key: true
    ai_context: Internal member key. Do not show unless asked for a member list.

  # ---------- who they are ----------
  first_name: { sql: '"first_name"', group_label: Contact, tags: [pii] }
  last_name: { sql: '"last_name"', group_label: Contact, tags: [pii] }
  email: { sql: '"email"', group_label: Contact, tags: [pii] }
  phone: { sql: '"phone"', group_label: Contact, tags: [pii] }
  crm_id: { sql: '"crm_id"', group_label: Contact }
  coach_id: { sql: '"coach_id"', hidden: true }
  has_phone_on_file:
    sql: '"has_phone_on_file"'
    group_label: Contact
    description: False when the CRM has no phone number, so coaches can only email or text.

  age_band:
    sql: '"age_band"'
    group_label: Demographics
    all_values: [Under 50, 50 to 64, 65 to 74, 75 to 84, 85+]
  sex: { sql: '"sex"', group_label: Demographics, all_values: [F, M] }
  state: { sql: '"state"', group_label: Demographics, synonyms: [region, location] }
  urbanicity:
    sql: '"urbanicity"'
    group_label: Demographics
    all_values: [Rural, Urban/Suburban]
    synonyms: [rural, urban]
  insurance_type:
    sql: '"insurance_type"'
    group_label: Insurance
    all_values: [Medicare FFS, Medicare Advantage, Medicaid, Commercial]
    synonyms: [payer type, coverage type, line of business]
  plan_name:
    sql: '"plan_name"'
    group_label: Insurance
    synonyms: [health plan, payer, plan]
    all_values: [Original Medicare, Summit Senior Advantage, Lakeshore Medicare Plus, Keystone Golden Choice,
                 Prairie Community Care (Medicaid MCO), Bluegrass Medicaid Partners, Cascade Employer PPO,
                 Meridian Choice HMO]
  primary_condition:
    sql: '"primary_condition"'
    group_label: Clinical
    synonyms: [condition, diagnosis category, program track]
    all_values: [Chronic low back pain, Chronic neck and joint pain, Fibromyalgia, Post-surgical pain,
                 Other chronic pain, Anxiety and stress]
  has_comorbid_anxiety:
    sql: '"has_comorbid_anxiety"'
    group_label: Clinical
    description: Pain members who also have anxiety and stress as a secondary condition.
    synonyms: [comorbid, pain and anxiety, dual condition]
  referral_source:
    sql: '"referral_source"'
    group_label: Acquisition
    all_values: [Provider referral, Health plan outreach, Web self-referral]
    synonyms: [channel, lead source, acquisition channel]
  intake_tech_comfort:
    sql: '"intake_tech_comfort"'
    group_label: Acquisition
    description: Member's self-reported comfort with technology at intake.
    all_values: [Low, Medium, High]
  has_home_wifi:
    sql: '"has_home_wifi"'
    group_label: Acquisition
    description: Without home wifi, sessions are stored on the headset and sync later.

  # ---------- journey dates ----------
  referral_date: { sql: '"referral_date"', group_label: Journey dates, timeframes: [date, week, month, quarter] }
  onboarding_date: { sql: '"onboarding_date"', group_label: Journey dates, timeframes: [date, week, month, quarter] }
  delivery_date:
    sql: '"delivery_date"'
    group_label: Journey dates
    timeframes: [date, week, month, quarter]
    synonyms: [headset delivered, ship date, start date]
  delivery_cohort_month:
    sql: '"delivery_cohort_month"'
    group_label: Journey dates
    description: Month the headset was delivered. Use this to group members into cohorts.
    synonyms: [cohort, cohort month, start month]
  first_session_date:
    sql: '"first_session_date"'
    group_label: Journey dates
    timeframes: [date, week, month]
    synonyms: [first VR session, go-live date]
  last_session_date:
    sql: '"last_session_date"'
    group_label: Journey dates
    timeframes: [date, week, month]
    synonyms: [last VR session, last used]
  last_synced_session_date:
    sql: '"last_synced_session_date"'
    group_label: Journey dates
    description: Last session the CRM had received by the snapshot date. Lags reality for offline headsets.

  # ---------- funnel and habit ----------
  is_delivered: { sql: '"is_delivered"', group_label: Funnel }
  is_activation_matured:
    sql: '"is_activation_matured"'
    group_label: Funnel
    description: Delivered at least 14 days before the snapshot, so activation can be judged fairly.
  has_started: { sql: '"has_started"', group_label: Funnel, description: Did at least one VR session. }
  is_activated:
    sql: '"is_activated"'
    group_label: Funnel
    description: First VR session within 14 days of delivery.
    synonyms: [activated, started, onboarded successfully]
  days_to_first_session:
    sql: '"days_to_first_session"'
    group_label: Funnel
    description: Days from headset delivery to first VR session.
    synonyms: [time to first session, time to value]
  week1_sessions: { sql: '"week1_sessions"', group_label: Funnel }
  week1_bucket:
    sql: '"week1_bucket"'
    group_label: Funnel
    all_values: [1 session, 2 sessions, 3 to 4 sessions, 5+ sessions]
    description: How many sessions the member did in the first 7 days after starting.
    synonyms: [first week usage, week one engagement]
  hit_week1_habit:
    sql: '"hit_week1_habit"'
    group_label: Funnel
    description: 3 or more sessions in the first 7 days after starting.
  is_week1_matured: { sql: '"is_week1_matured"', group_label: Funnel, hidden: true }

  # ---------- outreach ----------
  welcome_attempted_48h:
    sql: '"welcome_attempted_48h"'
    group_label: Coach outreach
    description: A coach attempted the welcome call within 48 hours of delivery.
  welcome_reached_48h:
    sql: '"welcome_reached_48h"'
    group_label: Coach outreach
    description: A coach actually spoke with the member within 48 hours of delivery.
    synonyms: [reached in 48 hours, early outreach, 48 hour call, welcome call]
  total_touches: { sql: '"total_touches"', group_label: Coach outreach }

  # ---------- retention ----------
  is_day30_matured: { sql: '"is_day30_matured"', group_label: Retention, hidden: true }
  is_day60_matured: { sql: '"is_day60_matured"', group_label: Retention, hidden: true }
  is_day90_matured: { sql: '"is_day90_matured"', group_label: Retention, hidden: true }
  retained_day30: { sql: '"retained_day30"', group_label: Retention, synonyms: [one month retention, 30 day retention] }
  retained_day60: { sql: '"retained_day60"', group_label: Retention }
  retained_day90: { sql: '"retained_day90"', group_label: Retention, synonyms: [three month retention] }
  completed_program:
    sql: '"completed_program"'
    group_label: Retention
    description: Finished the 8-week program (28+ sessions spanning 8+ weeks, or returned after completion).
  engagement_status:
    sql: '"engagement_status"'
    group_label: Retention
    all_values: [Active, At risk, Lapsed, Churned, Never activated, Completed, Not enrolled, Awaiting delivery]
    synonyms: [status, member status, health status]
    ai_context: Based on real session dates from the headset, not the CRM sync date.
  crm_engagement_status:
    sql: '"crm_engagement_status"'
    group_label: Retention
    description: The status the CRM showed, based only on synced sessions.
  days_since_last_session: { sql: '"days_since_last_session"', group_label: Retention }

  # ---------- device and returns ----------
  initial_firmware_version:
    sql: '"initial_firmware_version"'
    group_label: Device
    all_values: [4.1.3, 4.2.0, 4.3.1]
    synonyms: [firmware, software version]
  initial_batch: { sql: '"initial_batch"', group_label: Device, synonyms: [manufacturing batch] }
  replacement_count: { sql: '"replacement_count"', group_label: Device }
  current_order_status:
    sql: '"current_order_status"'
    group_label: Device
    all_values: [Delivered, Returned, Return requested, In transit, Cancelled, Pending verification]
  return_reason:
    sql: '"return_reason"'
    group_label: Device
    all_values: [Non-use, Never started, Program completed, Rental term ended, Discomfort or motion sickness,
                 Device issue, Insurance change, Deceased]
  headset_at_home: { sql: '"headset_at_home"', group_label: Device }
  is_idle_headset_30d:
    sql: '"is_idle_headset_30d"'
    group_label: Device
    description: Headset still at home, no session in 30+ days (or never used), delivered 30+ days ago.
    synonyms: [idle headset, unused headset, zombie headset]

  # ---------- outcomes and money ----------
  baseline_pain: { sql: '"baseline_pain"', group_label: Outcomes, description: Avg self-reported pain (0 to 10) in first 2 weeks. }
  week7_8_pain: { sql: '"week7_8_pain"', group_label: Outcomes, description: Avg self-reported pain in weeks 7 and 8. }
  pain_reduction_points: { sql: '"pain_reduction_points"', group_label: Outcomes }
  rental_months_billed: { sql: '"rental_months_billed"', group_label: Billing }
  billed_usd: { sql: '"billed_usd"', group_label: Billing, format: usdcurrency }
  paid_usd: { sql: '"paid_usd"', group_label: Billing, format: usdcurrency }

measures:
  members:
    aggregate_type: count_distinct
    sql: ${member_id}
    description: Distinct members.
    synonyms: [member count, how many members]

  delivered_members:
    aggregate_type: count_distinct
    sql: ${member_id}
    filters: { is_delivered: { is: true } }
    synonyms: [headsets delivered, enrolled members]

  delivered_members_matured:
    aggregate_type: count_distinct
    sql: ${member_id}
    filters: { is_delivered: { is: true }, is_activation_matured: { is: true } }
    hidden: true

  activated_members:
    aggregate_type: count_distinct
    sql: ${member_id}
    filters: { is_activated: { is: true }, is_activation_matured: { is: true } }

  activation_rate:
    sql: ${activated_members} / NULLIF(${delivered_members_matured}, 0)
    format: percent_1
    description: Share of delivered members (14+ days ago) who did a first session within 14 days.
    synonyms: [activation, start rate, onboarding conversion]

  median_days_to_first_session:
    aggregate_type: median
    sql: ${days_to_first_session}
    description: Typical days from delivery to first session, among members who started.

  week1_habit_rate:
    sql: >
      COUNT(DISTINCT CASE WHEN ${hit_week1_habit} AND ${is_week1_matured} THEN ${member_id} END)
      / NULLIF(COUNT(DISTINCT CASE WHEN ${has_started} AND ${is_week1_matured} THEN ${member_id} END), 0)
    format: percent_1
    description: Of members who started, share with 3+ sessions in their first week.

  welcome_reached_48h_rate:
    sql: >
      COUNT(DISTINCT CASE WHEN ${welcome_reached_48h} THEN ${member_id} END)
      / NULLIF(COUNT(DISTINCT CASE WHEN ${is_delivered} THEN ${member_id} END), 0)
    format: percent_1
    synonyms: [48 hour reach rate, welcome call reach rate]

  day30_retention_rate:
    sql: >
      COUNT(DISTINCT CASE WHEN ${retained_day30} AND ${is_day30_matured} THEN ${member_id} END)
      / NULLIF(COUNT(DISTINCT CASE WHEN ${has_started} AND ${is_day30_matured} THEN ${member_id} END), 0)
    format: percent_1
    description: Of members who started, share still doing sessions in days 28 to 34.
    synonyms: [retention, one month retention, 30 day retention, stickiness]

  day60_retention_rate:
    sql: >
      COUNT(DISTINCT CASE WHEN ${retained_day60} AND ${is_day60_matured} THEN ${member_id} END)
      / NULLIF(COUNT(DISTINCT CASE WHEN ${has_started} AND ${is_day60_matured} THEN ${member_id} END), 0)
    format: percent_1

  day90_retention_rate:
    sql: >
      COUNT(DISTINCT CASE WHEN ${retained_day90} AND ${is_day90_matured} THEN ${member_id} END)
      / NULLIF(COUNT(DISTINCT CASE WHEN ${has_started} AND ${is_day90_matured} THEN ${member_id} END), 0)
    format: percent_1
    synonyms: [three month retention, 90 day retention]

  completion_rate:
    sql: >
      COUNT(DISTINCT CASE WHEN ${completed_program} AND ${is_day60_matured} THEN ${member_id} END)
      / NULLIF(COUNT(DISTINCT CASE WHEN ${has_started} AND ${is_day60_matured} THEN ${member_id} END), 0)
    format: percent_1
    description: Of members who started at least 62 days ago, share who completed the 8-week program.

  active_members:
    aggregate_type: count_distinct
    sql: ${member_id}
    filters: { engagement_status: { is: Active } }
  at_risk_members:
    aggregate_type: count_distinct
    sql: ${member_id}
    filters: { engagement_status: { is: At risk } }
  idle_headsets:
    aggregate_type: count_distinct
    sql: ${member_id}
    filters: { is_idle_headset_30d: { is: true } }
    description: Headsets at home with no session in 30+ days. Each one is still being billed.
    synonyms: [unused headsets, zombie headsets]

  avg_pain_reduction:
    sql: AVG(${pain_reduction_points})
    description: Average drop in self-reported pain (0 to 10 scale) from weeks 1 to 2 versus weeks 7 to 8.
    synonyms: [pain improvement, outcome, clinical outcome]

  total_billed_usd: { aggregate_type: sum, sql: '${billed_usd}', format: usdcurrency }
  total_paid_usd: { aggregate_type: sum, sql: '${paid_usd}', format: usdcurrency }
