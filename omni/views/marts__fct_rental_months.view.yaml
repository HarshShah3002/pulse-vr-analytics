# View: one row per billed rental month (HCPCS E1905 capped rental), with usage in that month.
schema: marts
table_name: fct_rental_months
label: Rental Billing

dimensions:
  invoice_id: { sql: '"invoice_id"', primary_key: true }
  order_id: { sql: '"order_id"', hidden: true }
  member_id: { sql: '"member_id"', hidden: true }
  rental_month_number:
    sql: '"rental_month_number"'
    description: 1 to 13. Medicare capped rental ends after month 13.
  service_period_start: { sql: '"service_period_start"', timeframes: [date, month, quarter] }
  service_month: { sql: '"service_month"', synonyms: [billing month] }
  payer_plan: { sql: '"payer_plan"', synonyms: [plan, payer, health plan] }
  insurance_type: { sql: '"insurance_type"' }
  invoice_status:
    sql: '"invoice_status"'
    all_values: [Paid, Pending, Submitted, Denied, Appealed, Written off]
    synonyms: [claim status, billing status]
  sessions_in_period: { sql: '"sessions_in_period"' }
  is_zombie_month:
    sql: '"is_zombie_month"'
    description: Billed rental month in which the member did zero sessions.
    synonyms: [unused month, zombie rental, billed but not used]
    ai_context: These months carry audit and payer-trust risk. Frame them as an opportunity to re-engage or retrieve the headset.
  is_lost_revenue: { sql: '"is_lost_revenue"', description: Invoice denied or written off. }
  billed_amount_usd: { sql: '"billed_amount_usd"', format: usdcurrency }
  paid_amount_usd: { sql: '"paid_amount_usd"', format: usdcurrency }

measures:
  billed_months: { aggregate_type: count_distinct, sql: '${invoice_id}', synonyms: [rental months] }
  zombie_months:
    aggregate_type: count_distinct
    sql: ${invoice_id}
    filters: { is_zombie_month: { is: true } }
  zombie_month_share:
    sql: ${zombie_months} / NULLIF(${billed_months}, 0)
    format: percent_1
    description: Share of billed rental months with zero sessions.
    synonyms: [unused billing share, zombie rate]
  billed_usd: { aggregate_type: sum, sql: '${billed_amount_usd}', format: usdcurrency, synonyms: [revenue billed, gross billings] }
  paid_usd: { aggregate_type: sum, sql: '${paid_amount_usd}', format: usdcurrency, synonyms: [collections, cash collected] }
  zombie_billed_usd:
    aggregate_type: sum
    sql: ${billed_amount_usd}
    filters: { is_zombie_month: { is: true } }
    format: usdcurrency
    description: Dollars billed for months with zero use.
  adjudicated_months:
    aggregate_type: count_distinct
    sql: ${invoice_id}
    filters: { invoice_status: { is: [Paid, Denied, Appealed, Written off] } }
    hidden: true
  lost_months:
    aggregate_type: count_distinct
    sql: ${invoice_id}
    filters: { is_lost_revenue: { is: true } }
  denial_rate:
    sql: ${lost_months} / NULLIF(${adjudicated_months}, 0)
    format: percent_1
    description: Share of decided claims that were denied or written off (pending claims excluded).
    synonyms: [claim denial rate, rejection rate]
