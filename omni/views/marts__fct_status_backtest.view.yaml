# View: at each past month end, what status the CRM showed versus what was really true.
schema: marts
table_name: fct_status_backtest
label: CRM Status Accuracy

dimensions:
  snapshot_key:
    sql: ${member_id} || '-' || CAST(${snapshot_date} AS VARCHAR)
    primary_key: true
    hidden: true
  member_id: { sql: '"member_id"', hidden: true }
  snapshot_date: { sql: '"snapshot_date"', timeframes: [date, month], synonyms: [month end, snapshot] }
  has_home_wifi: { sql: '"has_home_wifi"', synonyms: [wifi, offline headset] }
  insurance_type: { sql: '"insurance_type"' }
  urbanicity: { sql: '"urbanicity"' }
  status_seen:
    sql: '"status_seen"'
    label: Status the CRM Showed
    all_values: [Active, At risk, Lapsed, Churned, No synced sessions]
  status_actual:
    sql: '"status_actual"'
    label: Actual Status
    all_values: [Active, At risk, Lapsed, Churned]
  is_false_alarm:
    sql: '"is_false_alarm"'
    description: Member was really active, but the CRM showed them as not active because sessions had not synced.
    synonyms: [misclassified, wrong status, false at risk]

measures:
  member_snapshots: { aggregate_type: count_distinct, sql: '${snapshot_key}' }
  actually_active:
    aggregate_type: count_distinct
    sql: ${snapshot_key}
    filters: { status_actual: { is: Active } }
  false_alarms:
    aggregate_type: count_distinct
    sql: ${snapshot_key}
    filters: { is_false_alarm: { is: true } }
  false_alarm_rate:
    sql: ${false_alarms} / NULLIF(${actually_active}, 0)
    format: percent_1
    description: Of members who were truly active at month end, share the CRM showed as not active.
    synonyms: [misclassification rate, status error rate]
