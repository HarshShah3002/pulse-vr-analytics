# Topic: Member Journey. The main topic for leadership questions.
base_view: marts__dim_members
label: Member Journey
description: One row per member from referral to return. Funnel, activation, retention, status, outcomes.
joins:
  marts__dim_coaches: {}
ai_fields: [all_views.*, -tag:pii]
ai_context: |-
  Use this topic for questions about how many members start, stick with, or leave the program,
  and which groups do better or worse.
  ## Defaults
  - "Activation" means activation_rate. "Retention" without a timeframe means day30_retention_rate.
  - When comparing groups (plan, condition, age band, referral source, 48-hour reach, week-1 bucket),
    always return the rate and the member count side by side.
  - Group cohorts by delivery_cohort_month.
  - For "how many members are active right now" use active_members.
  - For "idle", "unused" or "zombie" headsets use idle_headsets.
  ## Interpreting results for leaders
  - Members reached by a coach within 48 hours activate far more often, but members who pick up the
    phone are also more motivated to begin with. Say the effect is real but smaller than the raw gap,
    and point to the June 2026 SLA change (activation rose across all members) as the cleaner evidence.
  - Members with 3+ sessions in week one retain much better. Present week one as the window to act on.
  - Pain reduction is self-reported and only available for pain members who answered the pain prompt.
sample_queries:
  Activation by month:
    query:
      fields: [marts__dim_members.delivery_cohort_month, marts__dim_members.activation_rate, marts__dim_members.delivered_members]
      base_view: marts__dim_members
      sorts: [{ field: marts__dim_members.delivery_cohort_month }]
    description: Activation rate for each delivery cohort month.
    prompt: How has activation changed over time?
  Week one habit and retention:
    query:
      fields: [marts__dim_members.week1_bucket, marts__dim_members.day30_retention_rate, marts__dim_members.day90_retention_rate, marts__dim_members.members]
      base_view: marts__dim_members
      filters: { marts__dim_members.has_started: { is: true } }
    description: Day-30 and day-90 retention by number of sessions in the first week.
    prompt: Does first-week usage predict who stays?
  48 hour outreach:
    query:
      fields: [marts__dim_members.welcome_reached_48h, marts__dim_members.activation_rate, marts__dim_members.day30_retention_rate, marts__dim_members.delivered_members]
      base_view: marts__dim_members
    description: Activation and retention for members reached by a coach within 48 hours vs not.
    prompt: Do members we reach in the first 48 hours do better?
  Status right now:
    query:
      fields: [marts__dim_members.engagement_status, marts__dim_members.members]
      base_view: marts__dim_members
      filters: { marts__dim_members.engagement_status: { not: [Not enrolled, Awaiting delivery] } }
    description: Current engagement status mix.
    prompt: How many members are active right now?
  Retention by plan:
    query:
      fields: [marts__dim_members.plan_name, marts__dim_members.activation_rate, marts__dim_members.day30_retention_rate, marts__dim_members.members]
      base_view: marts__dim_members
    description: Activation and retention by health plan.
    prompt: Which health plans have the best retention?
