# Topic: CRM Status Accuracy.
base_view: marts__fct_status_backtest
label: CRM Status Accuracy
description: Backtest of the CRM engagement status at each month end versus what really happened.
joins:
  marts__dim_members: {}
ai_fields: [all_views.*, -tag:pii]
ai_context: |-
  Use this topic when someone asks whether the engagement status in the CRM can be trusted,
  or why active members get flagged at risk.
  - The key measure is false_alarm_rate split by has_home_wifi.
  - Explain it simply: headsets without home wifi save sessions and upload them days later, so the CRM
    thinks those members stopped. Coaches may call people who are doing fine.
  - Suggested fix to mention: check headset sync time before flagging, or extend the at-risk window
    for offline members.
sample_queries:
  False alarms by wifi:
    query:
      fields: [marts__fct_status_backtest.has_home_wifi, marts__fct_status_backtest.actually_active, marts__fct_status_backtest.false_alarm_rate]
      base_view: marts__fct_status_backtest
    description: How often truly active members were shown as inactive, by home wifi.
    prompt: Can we trust the engagement status in the CRM?
