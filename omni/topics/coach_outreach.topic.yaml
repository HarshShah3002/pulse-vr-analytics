# Topic: Coach Outreach.
base_view: marts__fct_outreach
label: Coach Outreach
description: Every coach touchpoint. Volume, reach rates, welcome-call speed.
joins:
  marts__dim_members: {}
ai_fields: [all_views.*, -tag:pii]
ai_context: |-
  Use this topic for coach workload and outreach effectiveness.
  - Reach rate differs by channel; only calls can be "Reached". SMS and email are "Delivered" or "Sent".
  - For welcome call speed, filter touch_type = Welcome and use hours_since_delivery.
  - Coach-level comparisons should mention that caseloads differ; do not rank individual coaches
    unless the user asks for it.
sample_queries:
  Outreach volume by type:
    query:
      fields: [marts__fct_outreach.touch_month, marts__fct_outreach.touch_type, marts__fct_outreach.touches]
      base_view: marts__fct_outreach
      pivots: [marts__fct_outreach.touch_type]
    description: Monthly coach touches by type.
    prompt: What are coaches spending their time on?
