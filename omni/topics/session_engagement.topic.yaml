# Topic: Session Engagement.
base_view: marts__fct_sessions
label: Session Engagement
description: Every VR session. Duration, modules, completion, time of day, in-session pain relief.
joins:
  marts__dim_members: {}
ai_fields: [all_views.*, -tag:pii]
ai_context: |-
  Use this topic for questions about how members use the headset: how often, how long, which modules.
  - "Session duration" means avg_session_minutes; mention the median too because a few long sessions skew the mean.
  - Use session_start_ts (headset time) for trends, never synced_at_ts.
  - "Which modules work best" should consider session_completion_rate and avg_in_session_pain_relief together.
  - Most sessions are 6 to 12 minutes by design; short does not mean bad.
sample_queries:
  Module performance:
    query:
      fields: [marts__fct_sessions.module, marts__fct_sessions.sessions, marts__fct_sessions.avg_session_minutes, marts__fct_sessions.session_completion_rate, marts__fct_sessions.avg_in_session_pain_relief]
      base_view: marts__fct_sessions
    description: Usage, length, completion and pain relief by module.
    prompt: Which modules are working best?
  Weekly sessions trend:
    query:
      fields: ["marts__fct_sessions.session_start_ts[week]", marts__fct_sessions.sessions, marts__fct_sessions.members_with_sessions]
      base_view: marts__fct_sessions
    description: Weekly sessions and active users.
    prompt: How many sessions are members doing each week?
