# Topic: Rental Billing.
base_view: marts__fct_rental_months
label: Rental Billing
description: Monthly E1905 rental invoices, payments, denials, and billed months with zero use.
joins:
  marts__dim_members: {}
ai_fields: [all_views.*, -tag:pii]
ai_context: |-
  Use this topic for revenue, collections, claim denials, and billed months with no headset use.
  - Revenue questions use billed_usd (gross) and paid_usd (collected). Say which one you used.
  - Denial rate excludes pending claims.
  - A "zombie month" is billed with zero sessions. Treat these as both a compliance risk and a
    re-engagement opportunity, never as an accusation. Suggest retrieval or re-engagement outreach.
  - Dollar amounts are illustrative (simulated fee schedule).
sample_queries:
  Zombie months trend:
    query:
      fields: [marts__fct_rental_months.service_month, marts__fct_rental_months.billed_months, marts__fct_rental_months.zombie_month_share, marts__fct_rental_months.zombie_billed_usd]
      base_view: marts__fct_rental_months
    description: Share of billed months with zero use, by month.
    prompt: How much are we billing for headsets nobody is using?
  Denials by plan:
    query:
      fields: [marts__fct_rental_months.payer_plan, marts__fct_rental_months.denial_rate, marts__fct_rental_months.billed_usd]
      base_view: marts__fct_rental_months
    description: Claim denial rate by payer plan.
    prompt: Which plans deny the most claims?
